name: self-hosted Runner
on:
  push:
    branches:
      - main
      - qa
      - dev
  pull_request:
    branches:
      - main
      - qa
      - dev

jobs:
  code-quality-check:
    name: ✅ Verificar calidad del código
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato con Prettier (OBLIGATORIO)
        run: |
          echo "🔍 Verificando formato del código con Prettier..."
          
          # Ejecutar prettier check y capturar la salida
          if npm run format:check 2>&1; then
            echo "✅ ¡Perfecto! El código está correctamente formateado"
          else
            echo ""
            echo "❌ FORMATO INCORRECTO DETECTADO"
            echo "================================"
            echo ""
            echo "Los siguientes archivos necesitan ser formateados:"
            echo ""
            
            # Mostrar específicamente qué archivos están mal formateados
            npm run format:check 2>&1 || true
            
            echo ""
            echo "� CÓMO SOLUCIONARLO:"
            echo "1. Ejecuta en tu terminal local: npm run format"
            echo "2. Haz commit de los cambios: git add . && git commit -m 'fix: formateo de código'"
            echo "3. Haz push: git push"
            echo ""
            echo "💡 También puedes configurar tu editor para formatear automáticamente al guardar"
            
            exit 1
          fi

  deploy:
    name: 🚀 Desplegar aplicación
    runs-on: self-hosted
    needs: code-quality-check
    if: success()
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setear nombre del servicio
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "SERVICE_NAME=web-prod" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "SERVICE_NAME=web-dev" >> $GITHUB_ENV
          fi

      - name: Detener y eliminar contenedor
        run: |
          docker-compose stop $SERVICE_NAME || true
          docker-compose rm -f $SERVICE_NAME || true

      - name: Reconstruir y levantar contenedor
        run: |
          docker-compose up -d --build $SERVICE_NAME

      - name: Verificar despliegue
        run: |
          if [ $? -eq 0 ]; then
            echo "🚀 Deploy completado con éxito"
          else
            echo "❌ Falló el deploy"
            exit 1
          fi